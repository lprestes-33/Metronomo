<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadência Run</title>
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #111827; color: #f3f4f6; user-select: none; }
        .pulse-anim { animation: pulseBeat 0.2s ease-out; }
        @keyframes pulseBeat { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .active-btn { background-color: #10b981 !important; color: white !important; }
        input[type=range] { accent-color: #10b981; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="p-6 text-center bg-gray-900 shadow-md">
        <h1 class="text-2xl font-bold text-emerald-400 uppercase">Cadência Run</h1>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        
        <!-- Timer -->
        <div class="mb-8 text-center">
            <div id="timeDisplay" class="text-5xl font-mono text-white">00:00</div>
        </div>

        <!-- Volume Control -->
        <div class="w-full mb-8 bg-gray-800 p-4 rounded-xl">
            <div class="flex justify-between text-xs text-gray-400 mb-2">
                <span><i class="fas fa-volume-down"></i></span>
                <span>VOLUME DO METRÔNOMO</span>
                <span><i class="fas fa-volume-up"></i></span>
            </div>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Cadence Buttons -->
        <div class="w-full mb-8 flex justify-between gap-3">
            <button onclick="setCadence(160)" id="btn-160" class="flex-1 py-3 rounded-xl bg-gray-800 font-bold active-btn">160</button>
            <button onclick="setCadence(170)" id="btn-170" class="flex-1 py-3 rounded-xl bg-gray-800 font-bold">170</button>
            <button onclick="setCadence(180)" id="btn-180" class="flex-1 py-3 rounded-xl bg-gray-800 font-bold">180</button>
        </div>

        <button id="playBtn" class="w-full bg-emerald-500 text-white rounded-full py-4 text-xl font-bold shadow-lg">
            <i class="fas fa-play" id="playIcon"></i> <span id="playText">Iniciar</span>
        </button>
    </main>

    <script>
        let audioCtx, masterGain;
        let isPlaying = false, cadence = 160, currentNote = 0, nextNoteTime = 0;
        const volumeSlider = document.getElementById('volumeSlider');

        // Worker para background
        const worker = new Worker(URL.createObjectURL(new Blob([`
            let timerID = null;
            self.onmessage = (e) => {
                if(e.data === 'start') timerID = setInterval(() => postMessage('tick'), 25);
                else { clearInterval(timerID); timerID = null; }
            };
        `])));

        worker.onmessage = () => scheduler();

        function setCadence(val) {
            cadence = val;
            document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('active-btn'));
            document.getElementById('btn-'+val).classList.add('active-btn');
        }

        playBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
            }
            masterGain.gain.value = volumeSlider.value;
            
            isPlaying = !isPlaying;
            if (isPlaying) {
                audioCtx.resume();
                nextNoteTime = audioCtx.currentTime;
                worker.postMessage('start');
                playText.innerText = "Parar";
            } else {
                worker.postMessage('stop');
                playText.innerText = "Iniciar";
            }
        });

        volumeSlider.oninput = () => { if(masterGain) masterGain.gain.value = volumeSlider.value; };

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                playBeat(currentNote, nextNoteTime);
                nextNoteTime += 60.0 / cadence;
                currentNote++;
            }
        }

        function playBeat(num, time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(masterGain); // Conectado ao controle de volume

            if (num % 2 === 0) { // Bulbo
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, time);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            } else { // Sino
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, time);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 1.2);
            }
            osc.start(time); osc.stop(time + 1.5);
        }
    </script>
</body>
</html>
